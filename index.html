<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Beach Coastal Flood & Tide Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0f172a; }
        #map { height: 450px !important; width: 100% !important; background: #1e293b; }
        @media (min-width: 1024px) { #map { height: 100% !important; min-height: 600px; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-lg">🌊</div>
            <div>
                <h1 class="text-base sm:text-xl font-bold text-white">Long Beach Flood Simulator</h1>
                <p class="text-xs text-slate-400">Naples • Alamitos Bay • Belmont Shore • Peninsula</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <input type="text" id="address-input" placeholder="Search LB Address..." class="bg-slate-900 border border-slate-700 rounded px-3 py-1 text-xs text-slate-200 w-full">
            <button onclick="searchAddress()" class="bg-blue-600 text-xs px-3 py-1 rounded text-white font-medium">Find</button>
            <button onclick="syncLiveTide()" class="bg-emerald-600 text-xs px-3 py-1 rounded text-white font-medium whitespace-nowrap">Sync Tide</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row relative">
        <aside class="w-full lg:w-96 bg-slate-800 border-r border-slate-700 p-4 space-y-4">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs uppercase text-slate-400 font-semibold">Water Level</span>
                    <span id="water-val" class="text-xl font-bold text-blue-400">5.00 ft</span>
                </div>
                <input type="range" id="water-slider" min="0" max="10" step="0.25" value="5.00" class="w-full h-2 bg-slate-700 rounded appearance-none cursor-pointer accent-blue-500" oninput="updateWaterLevel(this.value)">
            </div>

            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                <div class="bg-slate-900 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block">Area</span>
                    <span id="stat-acres" class="font-bold text-white">142 Ac</span>
                </div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block">Buildings</span>
                    <span id="stat-structures" class="font-bold text-amber-400">380</span>
                </div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block">Roads</span>
                    <span id="stat-roads" class="font-bold text-red-400">2.4 Mi</span>
                </div>
            </div>
        </aside>

        <main class="w-full flex-1 relative">
            <div id="map"></div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const map = L.map('map', { zoomControl: false }).setView([33.7485, -118.1280], 14);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 400);

            const hotspots = [
                { name: "Naples Canals", lat: 33.7472, lng: -118.1345, elevation: 4.8 },
                { name: "Belmont Shore", lat: 33.7551, lng: -118.1392, elevation: 6.2 },
                { name: "The Peninsula", lat: 33.7392, lng: -118.1275, elevation: 5.1 },
                { name: "Alamitos Bay Marina", lat: 33.7480, lng: -118.1200, elevation: 4.2 }
            ];

            let markers = [];
            function render() {
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                const water = parseFloat(document.getElementById('water-slider').value);
                hotspots.forEach(spot => {
                    const flooded = water >= spot.elevation;
                    const c = L.circleMarker([spot.lat, spot.lng], {
                        radius: 8,
                        fillColor: flooded ? '#ef4444' : '#2563eb',
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.9
                    }).addTo(map);
                    c.bindPopup(`<b>${spot.name}</b><br>Elevation: ${spot.elevation} ft`);
                    markers.push(c);
                });
            }

            window.updateWaterLevel = function(val) {
                document.getElementById('water-val').innerText = parseFloat(val).toFixed(2) + ' ft';
                render();
            };

            window.syncLiveTide = async function() {
                try {
                    const res = await fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=latest&station=9410660&product=water_level&datum=NAVD&units=english&time_zone=gmt&format=json');
                    const d = await res.json();
                    if (d.data && d.data[0]) {
                        document.getElementById('water-slider').value = d.data[0].v;
                        window.updateWaterLevel(d.data[0].v);
                    }
                } catch (e) {}
            };

            window.searchAddress = async function() {
                const q = document.getElementById('address-input').value;
                if (!q) return;
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ', Long Beach, CA')}`);
                const data = await res.json();
                if (data && data[0]) {
                    map.setView([data[0].lat, data[0].lon], 16);
                }
            };

            render();
        });
    </script>
</body>
</html>
