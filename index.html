<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Long Beach Coastal Flood Simulator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #f8fafc; }
        header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 16px; color: #ffffff; }
        .subtitle { font-size: 11px; color: #94a3b8; }
        .container { display: flex; flex-direction: column; height: calc(100% - 57px); }
        .controls { background: #1e293b; padding: 16px; border-bottom: 1px solid #334155; }
        .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .water-label { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #cbd5e1; }
        .water-val { font-size: 18px; font-weight: bold; color: #60a5fa; }
        input[type=range] { width: 100%; height: 6px; border-radius: 3px; accent-color: #3b82f6; }
        .stats { display: flex; gap: 8px; margin-top: 12px; }
        .stat-card { flex: 1; background: #0f172a; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid #334155; }
        .stat-title { font-size: 10px; color: #94a3b8; display: block; }
        .stat-num { font-size: 14px; font-weight: bold; color: #f8fafc; }
        #map { width: 100%; height: 400px; flex-grow: 1; background: #0f172a; }
        @media (min-width: 768px) {
            .container { flex-direction: row; }
            .controls { width: 340px; border-r: 1px solid #334155; border-b: none; }
            #map { height: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Long Beach Flood Simulator</h1>
            <div class="subtitle">Naples • Belmont Shore • Peninsula</div>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="slider-row">
                <span class="water-label">Water Level</span>
                <span id="water-val" class="water-val">5.00 ft</span>
            </div>
            
            <input type="range" id="water-slider" min="0" max="10" step="0.25" value="5.00" oninput="updateWaterLevel(this.value)">

            <div class="stats">
                <div class="stat-card">
                    <span class="stat-title">Area</span>
                    <span id="stat-acres" class="stat-num">142 Ac</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Buildings</span>
                    <span id="stat-structures" class="stat-num" style="color:#fbbf24;">380</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Roads</span>
                    <span id="stat-roads" class="stat-num" style="color:#f87171;">2.4 Mi</span>
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        var map, hotspotMarkers = [], floodOverlay = null;

        var hotspots = [
            { name: "Naples Canal System", lat: 33.7472, lng: -118.1345, elevation: 4.8 },
            { name: "Belmont Shore (2nd St)", lat: 33.7551, lng: -118.1392, elevation: 6.2 },
            { name: "The Peninsula Bayfront", lat: 33.7392, lng: -118.1275, elevation: 5.1 },
            { name: "Alamitos Bay Marina", lat: 33.7480, lng: -118.1200, elevation: 4.2 }
        ];

        function updateWaterLevel(val) {
            document.getElementById('water-val').innerText = parseFloat(val).toFixed(2) + ' ft';
            
            var acres = Math.round(Math.max(0, (val - 4.0) * 120));
            var structures = Math.round(Math.max(0, (val - 4.5) * 140));
            var roads = ((Math.max(0, val - 4.2) * 0.8)).toFixed(1);

            document.getElementById('stat-acres').innerText = acres + ' Ac';
            document.getElementById('stat-structures').innerText = structures;
            document.getElementById('stat-roads').innerText = roads + ' Mi';

            if (map) render(parseFloat(val));
        }

        function render(waterLevel) {
            hotspotMarkers.forEach(function(m) { map.removeLayer(m); });
            hotspotMarkers = [];

            hotspots.forEach(function(spot) {
                var isFlooded = waterLevel >= spot.elevation;
                var circle = L.circleMarker([spot.lat, spot.lng], {
                    radius: 8,
                    fillColor: isFlooded ? '#ef4444' : '#3b82f6',
                    color: '#ffffff',
                    weight: 2,
                    fillOpacity: 0.9
                }).addTo(map);

                circle.bindPopup('<b>' + spot.name + '</b><br>Elevation: ' + spot.elevation + ' ft NAVD88');
                hotspotMarkers.push(circle);
            });

            if (floodOverlay) map.removeLayer(floodOverlay);
            if (waterLevel > 4.0) {
                var naplesCoords = [
                    [33.7495, -118.1370],
                    [33.7490, -118.1310],
                    [33.7445, -118.1320],
                    [33.7450, -118.1380]
                ];
                floodOverlay = L.polygon(naplesCoords, {
                    color: '#2563eb',
                    fillColor: '#60a5fa',
                    fillOpacity: 0.5,
                    weight: 2
                }).addTo(map);
            }
        }

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([33.7485, -118.1280], 14);
            
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            setTimeout(function() {
                map.invalidateSize();
                updateWaterLevel(5.00);
            }, 300);
        };
    </script>
</body>
</html>
